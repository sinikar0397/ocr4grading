<svg viewBox="0 0 1440 460" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', 'Apple SD Gothic Neo', 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3b3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="460" fill="#fafbfc"/>

  <!-- connectors -->
  <line x1="345" y1="205" x2="375" y2="205" stroke="#9ca3b3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="205" x2="735" y2="205" stroke="#9ca3b3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1065" y1="205" x2="1095" y2="205" stroke="#9ca3b3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Panel 1: 시험 선택 -->
  <g>
    <rect x="20" y="20" width="320" height="370" rx="12" fill="#ffffff" stroke="#ecf0f3"/>
    <circle cx="46" cy="50" r="11" fill="#00a97a"/>
    <text x="46" y="54" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="66" y="55" font-size="15" font-weight="700" fill="#0b0e14">시험 선택</text>

    <text x="46" y="92" font-size="11" font-weight="600" fill="#6a7385">과목</text>
    <rect x="46" y="100" width="248" height="36" rx="6" fill="#ffffff" stroke="#ecf0f3"/>
    <text x="58" y="123" font-size="13" fill="#0b0e14">데이터과학</text>
    <text x="270" y="123" font-size="11" fill="#9ca3b3">▾</text>

    <text x="46" y="156" font-size="11" font-weight="600" fill="#6a7385">시험</text>
    <rect x="46" y="164" width="248" height="36" rx="6" fill="#ffffff" stroke="#00a97a" stroke-width="1.5"/>
    <text x="58" y="187" font-size="13" fill="#0b0e14">중간고사_1회</text>
    <text x="270" y="187" font-size="11" fill="#9ca3b3">▾</text>

    <text x="46" y="228" font-size="11" fill="#6a7385">찾는 시험이 없나요?</text>
    <text x="46" y="246" font-size="12" font-weight="600" fill="#00a97a">먼저 등록하기 →</text>

    <line x1="46" y1="272" x2="294" y2="272" stroke="#ecf0f3"/>
    <text x="170" y="300" font-size="11" fill="#9ca3b3" text-anchor="middle">등록된 시험이면 이 단계 통과</text>
  </g>
  <text x="180" y="428" font-size="13" font-weight="700" fill="#0b0e14" text-anchor="middle">시험 선택 (있으면 스킵)</text>

  <!-- Panel 2: 답안지 사진 업로드 -->
  <g>
    <rect x="380" y="20" width="320" height="370" rx="12" fill="#ffffff" stroke="#ecf0f3"/>
    <circle cx="406" cy="50" r="11" fill="#00a97a"/>
    <text x="406" y="54" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="426" y="55" font-size="15" font-weight="700" fill="#0b0e14">답안지 사진 업로드</text>

    <text x="406" y="90" font-size="12" fill="#6a7385">답안지를 촬영한 사진을</text>
    <text x="406" y="108" font-size="12" fill="#6a7385">전부 올리세요 (여러 장 가능)</text>

    <rect x="406" y="130" width="248" height="42" rx="6" fill="#ffffff" stroke="#ecf0f3"/>
    <rect x="412" y="136" width="76" height="30" rx="6" fill="#fafbfc" stroke="#ecf0f3"/>
    <text x="450" y="155" font-size="11" font-weight="700" fill="#0b0e14" text-anchor="middle">사진 선택</text>
    <text x="498" y="155" font-size="11" fill="#6a7385">IMG_042.jpg 외 2장</text>

    <rect x="406" y="188" width="248" height="42" rx="6" fill="#0b0e14"/>
    <text x="530" y="214" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">업로드하고 계속</text>

    <text x="530" y="270" font-size="11" fill="#9ca3b3" text-anchor="middle">사진 여러 장 = 답안지 여러 페이지</text>
  </g>
  <text x="540" y="428" font-size="13" font-weight="700" fill="#0b0e14" text-anchor="middle">답안지 사진 업로드</text>

  <!-- Panel 3: 문항별 크롭 + OCR 확인 -->
  <g>
    <rect x="740" y="20" width="320" height="370" rx="12" fill="#ffffff" stroke="#ecf0f3"/>
    <circle cx="766" cy="50" r="11" fill="#00a97a"/>
    <text x="766" y="54" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="786" y="55" font-size="15" font-weight="700" fill="#0b0e14">문항 영역 지정 + 전사</text>

    <!-- qdots -->
    <g font-size="10" font-weight="700" text-anchor="middle">
      <circle cx="772" cy="82" r="10" fill="#00a97a"/><text x="772" y="86" fill="#fff">1</text>
      <circle cx="796" cy="82" r="10" fill="#00a97a"/><text x="796" y="86" fill="#fff">2</text>
      <circle cx="820" cy="82" r="10" fill="#ffffff" stroke="#00a97a" stroke-width="1.5"/><text x="820" y="86" fill="#00a97a">3</text>
      <circle cx="844" cy="82" r="10" fill="#ffffff" stroke="#ecf0f3" stroke-width="1.5"/><text x="844" y="86" fill="#9ca3b3">4</text>
      <circle cx="868" cy="82" r="10" fill="#ffffff" stroke="#ecf0f3" stroke-width="1.5"/><text x="868" y="86" fill="#9ca3b3">5</text>
    </g>

    <!-- photo with selection box -->
    <rect x="766" y="104" width="248" height="130" rx="6" fill="#f4f5f7" stroke="#ecf0f3"/>
    <line x1="766" y1="130" x2="1014" y2="130" stroke="#e3e6ea"/>
    <line x1="766" y1="156" x2="1014" y2="156" stroke="#e3e6ea"/>
    <line x1="766" y1="182" x2="1014" y2="182" stroke="#e3e6ea"/>
    <line x1="766" y1="208" x2="1014" y2="208" stroke="#e3e6ea"/>
    <rect x="800" y="150" width="150" height="46" fill="rgba(208,62,94,0.12)" stroke="#d03e5e" stroke-width="2" stroke-dasharray="4 3"/>

    <rect x="766" y="244" width="120" height="30" rx="6" fill="#ffffff" stroke="#ecf0f3"/>
    <text x="826" y="263" font-size="10" font-weight="700" fill="#0b0e14" text-anchor="middle">이 영역 추가</text>
    <rect x="894" y="244" width="120" height="30" rx="6" fill="#00a97a"/>
    <text x="954" y="263" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">전사하기 →</text>

    <rect x="766" y="288" width="248" height="70" rx="6" fill="#fafbfc" stroke="#ecf0f3"/>
    <text x="778" y="306" font-size="10" font-weight="700" fill="#6a7385">인식된 답안 — 맞게 읽혔는지 확인</text>
    <text x="778" y="324" font-size="10" fill="#0b0e14">데이터 시각화의 장점으로는...</text>
    <text x="778" y="340" font-size="10" fill="#0b0e14">인사이트를 얻을 수 있다는 점...</text>
  </g>
  <text x="900" y="428" font-size="13" font-weight="700" fill="#0b0e14" text-anchor="middle">문항별 영역 지정 → OCR 확인</text>

  <!-- Panel 4: 결과 확인 -->
  <g>
    <rect x="1100" y="20" width="320" height="370" rx="12" fill="#ffffff" stroke="#ecf0f3"/>
    <circle cx="1126" cy="50" r="11" fill="#00a97a"/>
    <text x="1126" y="54" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="1146" y="55" font-size="15" font-weight="700" fill="#0b0e14">결과 확인</text>

    <text x="1126" y="100" font-size="26" font-weight="800" fill="#0b0e14">7 / 10</text>
    <text x="1126" y="118" font-size="10" font-weight="600" fill="#6a7385">정답 개수</text>
    <text x="1240" y="100" font-size="26" font-weight="800" fill="#0b0e14">10</text>
    <text x="1240" y="118" font-size="10" font-weight="600" fill="#6a7385">제출한 문항</text>

    <rect x="1126" y="140" width="248" height="52" rx="6" fill="#e8f7f1"/>
    <text x="1138" y="162" font-size="12" font-weight="800" fill="#0b0e14">1번</text>
    <text x="1138" y="180" font-size="10" font-weight="700" fill="#067a56">정답</text>
    <text x="1200" y="180" font-size="9" fill="#4a5568">풀이 과정이 정답과 일치해요</text>

    <rect x="1126" y="200" width="248" height="66" rx="6" fill="#fbeaef"/>
    <text x="1138" y="222" font-size="12" font-weight="800" fill="#0b0e14">2번</text>
    <text x="1138" y="240" font-size="10" font-weight="700" fill="#d03e5e">오답</text>
    <text x="1200" y="240" font-size="9" fill="#4a5568">핵심 근거가 빠졌어요.</text>
    <text x="1200" y="252" font-size="9" fill="#4a5568">예시를 포함해 서술하세요.</text>
  </g>
  <text x="1260" y="428" font-size="13" font-weight="700" fill="#0b0e14" text-anchor="middle">문항별 정답/오답 + 피드백</text>
</svg>
