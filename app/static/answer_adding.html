<h2>문항 정답 수동 입력/수정</h2>

<form id="answerForm">
  <input type="number" name="exam_id" placeholder="exam_id" required>
  <input type="text" name="number" placeholder="문제 번호" required>
  <input type="text" name="correct_answer" placeholder="정답" required>
  <input type="text" name="explanation" placeholder="해설(선택)">
  <button type="submit">정답 입력</button>
</form>
<pre id="answerStatus"></pre>

<script src="/static/common.js"></script>
<script>
document.getElementById("answerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const examId = form.exam_id.value;
  const number = form.number.value;
  const statusEl = document.getElementById("answerStatus");

  const body = new FormData();
  body.append("correct_answer", form.correct_answer.value);
  body.append("explanation", form.explanation.value);

  statusEl.textContent = "요청 중...";
  statusEl.style.color = "";
  statusEl.style.background = "";

  const result = await callApi(`/exams/${examId}/questions/${number}`, {
    method: "PUT",
    body,
  });
  showStatus(statusEl, result, "정답 저장 완료");
});
</script>
